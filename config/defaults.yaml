# setup-work global defaults.
#
# Override any value by creating ~/.config/setup-work/defaults.yaml (or the file
# pointed to by $SETUP_WORK_USER_CONFIG_DIR/defaults.yaml). Mappings are merged
# key by key; lists and scalars are replaced.
#
# Paths support "~" and environment variables. XDG_* variables are honoured.

paths:
  data_dir: ${XDG_DATA_HOME:-~/.local/share}/setup-work
  state_dir: ${XDG_STATE_HOME:-~/.local/state}/setup-work
  bin_dir: ${SETUP_WORK_BIN_DIR:-~/.local/bin}

inference:
  host: 127.0.0.1
  port: 8000
  # Fraction of each GPU vLLM is allowed to pre-allocate.
  gpu_memory_utilization: 0.90
  # Memory that must remain free on every device after loading (GiB).
  vram_safety_margin_gb: 1.0
  # Fixed runtime overhead per device (GiB): CUDA context, CUDA graphs,
  # activation buffers, NCCL workspace, compute buffers. These are estimates.
  runtime_overhead_gb:
    vllm: 2.0
    llama.cpp: 0.6
  ready_timeout_s: 900
  stop_timeout_s: 30
  default_kv_cache_dtype: fp16

recommend:
  default_context: 8192
  default_concurrency: 1
  max_results: 5
  # RAM to leave for the OS and other processes (GiB).
  ram_safety_margin_gb: 4.0

downloads:
  # Ask for confirmation before downloading more than this many GiB.
  confirm_above_gb: 1.0

# Pinned user-space tool installers. Every artifact is checked against its sha256.
