# Общие настройки setup-work.
# Переопределения: defaults.yaml в SETUP_WORK_USER_CONFIG_DIR или стандартном
# пользовательском каталоге. Словари объединяются по ключам, списки заменяются.
# В путях поддерживаются ~, переменные окружения и настройки XDG.

paths:
  data_dir: ${XDG_DATA_HOME:-~/.local/share}/setup-work
  state_dir: ${XDG_STATE_HOME:-~/.local/state}/setup-work
  bin_dir: ${SETUP_WORK_BIN_DIR:-~/.local/bin}

inference:
  host: 127.0.0.1
  port: 8000
  # Доля памяти каждого GPU, которую vLLM может занять заранее.
  gpu_memory_utilization: 0.90
  # Запас свободной памяти каждого устройства после загрузки, GiB.
  vram_safety_margin_gb: 1.0
  # Оценка накладных расходов на устройство, GiB: контекст и графы CUDA,
  # активации, рабочая память NCCL и вычислительные буферы.
  runtime_overhead_gb:
    vllm: 2.0
    llama.cpp: 0.6
  ready_timeout_s: 900
  stop_timeout_s: 30
  default_kv_cache_dtype: fp16

recommend:
  default_context: 8192
  default_concurrency: 1
  max_results: 5
  # Запас RAM для ОС и остальных процессов, GiB.
  ram_safety_margin_gb: 4.0

downloads:
  # Порог объёма загрузки, после которого запрашивается подтверждение, GB.
  confirm_above_gb: 1.0

