# Харнессы: внутренние репозитории Bitbucket и пакеты корпоративных PyPI/npm.
# Редактируйте прямо здесь. Для git-рецептов замените CHANGE-ME в repository/ref.
# repository — HTTPS-ссылка Clone: https://<host>/scm/<PROJECT>/<repo>.git.
# ref — ваш тег или SHA коммита; токены в URL и YAML не вставляются.
# Git использует ваш credential helper. Хост добавляется в trusted_git_hosts
# файла config/corporate.yaml. Реестры пакетов задаются в config/bootstrap.env.
#
# qwen-code, opencode, pi, hermes, deepseek и skillhub ниже берутся из Bitbucket.
# claude-code, codex и aider сохранены как пакеты корпоративных npm/PyPI.
# Команды сборки и пути бинарников git-рецептов — заготовки из examples/corp:
# сверьте их со структурой ваших внутренних форков.
# Для opencode из этого рецепта отдельно нужен bun, bootstrap его не устанавливает.
# Для Python-рецептов ниже нужен установленный Python 3.12.
#
# Проверка плана после заполнения параметров моделей:
#   make harness-install NAME=qwen-code DRY_RUN=1
# Установка:
#   make harness-install NAME=qwen-code
#   make harness-doctor NAME=qwen-code
#
# Основные поля:
# source: npm | pypi | git | local
# install.method: npm | uv | none
# install.build: список команд в виде argv
# binaries: имена или {name, path, interpreter}; path относительно checkout

harnesses:
  claude-code:
    description: Anthropic Claude Code agentic coding CLI
    source: npm
    package: "@anthropic-ai/claude-code"
    version: 2.1.285
    binaries: [claude]
    requires: {node: ">=22"}
    environment:
      optional: [ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, ANTHROPIC_MODEL]
    verify: [claude, --version]

  codex:
    description: OpenAI Codex CLI
    source: npm
    package: "@openai/codex"
    version: 0.159.1
    binaries: [codex]
    requires: {node: ">=16"}
    environment:
      optional: [OPENAI_API_KEY, OPENAI_BASE_URL]
    verify: [codex, --version]

  # Исходный проект: QwenLM/qwen-code — рабочие пространства npm, bin scripts/cli-entry.js, Node >= 22.
  qwen-code:
    description: Qwen Code (внутренний форк)
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/qwen-code.git
    ref: CHANGE-ME          # тег или SHA коммита
    install:
      method: none
      build:
        - [npm, ci]
        - [npm, run, build]
    binaries:
      - {name: qwen, path: scripts/cli-entry.js, interpreter: node}
    requires: {node: ">=22"}
    environment:
      optional: [OPENAI_BASE_URL, OPENAI_API_KEY, OPENAI_MODEL]
    verify: [qwen, --version]

  # Исходный проект: anomalyco/opencode — монорепозиторий Bun, CLI: packages/cli/src/index.ts.
  opencode:
    description: OpenCode (внутренний форк)
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/opencode.git
    ref: CHANGE-ME
    install:
      method: none
      build:
        - [bun, install, --frozen-lockfile]
    binaries:
      - {name: opencode, path: packages/cli/src/index.ts, interpreter: bun}
    requires_commands: [bun]
    environment:
      optional: [OPENAI_BASE_URL, OPENAI_API_KEY]
    verify: [opencode, --version]

  # Исходный проект: badlogic/pi-mono — рабочие пространства npm, bin packages/coding-agent/dist/bundle/cli.js,
  # Node >= 22.19.
  pi:
    description: pi coding agent (внутренний форк)
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/pi-mono.git
    ref: CHANGE-ME
    install:
      method: none
      build:
        - [npm, ci]
        - [npm, run, build]
    binaries:
      - {name: pi, path: packages/coding-agent/dist/bundle/cli.js, interpreter: node}
    requires: {node: ">=22.19"}
    verify: [pi, --version]

  # Исходный проект: NousResearch/hermes-agent — Python (>=3.11,<3.15), команда запуска `hermes`.
  hermes:
    description: Hermes Agent (внутренний форк)
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/hermes-agent.git
    ref: CHANGE-ME
    install:
      method: uv            # отдельный venv, пакеты из корпоративного PyPI
      python: "3.12"
    binaries: [hermes]
    environment:
      optional: [OPENAI_BASE_URL, OPENAI_API_KEY]
    verify: [hermes, --help]

  # deepseek: внутренний харнес. Заполните под ваш проект — ниже два типичных варианта.
  deepseek:
    description: DeepSeek coding agent (внутренний)
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/deepseek-agent.git
    ref: CHANGE-ME
    # Вариант A — Python-пакет с команда запуска:
    install: {method: uv, python: "3.12"}
    binaries: [deepseek]
    # Вариант B — Node/TypeScript:
    # install:
    #   method: none
    #   build: [[npm, ci], [npm, run, build]]
    # binaries:
    #   - {name: deepseek, path: dist/cli.js, interpreter: node}
    environment:
      optional: [DEEPSEEK_BASE_URL, OPENAI_BASE_URL, OPENAI_API_KEY]
    verify: [deepseek, --help]

  # skillhub: внутренний репозиторий навыков (skills) для агентов. Пока только
  # клонируется на зафиксированный ref в <data>/harnesses/skillhub/src; как раскладывать
  # навыки по агентам — добавим, когда будет понятна структура репозитория.
  #   make harness-install NAME=skillhub
  #   make harness-update  NAME=skillhub REF=<новый тег или commit>
  skillhub:
    description: SkillHub (внутренний репозиторий навыков)
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/skillhub.git
    ref: CHANGE-ME          # тег или SHA коммита
    install:
      method: none          # ничего не собирается, только checkout

  aider:
    description: Aider AI pair programming in the terminal
    source: pypi
    package: aider-chat
    version: 0.86.2
    # aider-chat 0.86.2 требует Python >=3.10,<3.13
    install: {method: uv, python: "3.12"}
    binaries: [aider]
    environment:
      optional: [OPENAI_API_KEY, OPENAI_API_BASE, ANTHROPIC_API_KEY]
    verify: [aider, --version]
