# Where setup-work takes tools, engines and model weights from. Nothing is downloaded
# from public hosts. Empty here: put your values into ~/.config/setup-work/corporate.yaml
# (`make init` creates it from examples/corp/corporate.yaml).
#
# hdfs:              how to read hdfs:// URIs (`hdfs dfs -get`, Kerberos ticket check)
# env:               non-secret environment for every command setup-work runs
# trusted_git_hosts: harness builds from these hosts do not need --allow-build
# models / engines / tools: artifact sources

hdfs:
  cli: hdfs
  kerberos: auto
env: {}
trusted_git_hosts: []
models: {}
engines: {}
tools: {}
