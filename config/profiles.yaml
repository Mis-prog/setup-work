# Development profiles. Profiles compose through `extends`; lists are merged
# (order preserved, duplicates removed) and mappings are merged key by key with
# the child winning. Add your own in ~/.config/setup-work/profiles.yaml.
#
#   tools.required / tools.optional   bootstrap tools (see `setup-work bootstrap --help`)
#   harnesses.required / optional     harness names from harnesses.yaml
#   engines                           inference engines to install (llama.cpp, vllm)
#   models.preferences                defaults for `recommend` (task, engine, context)
#   models.pull                       catalog refs to download; only honoured with
#                                     `--allow-downloads` (make ... ALLOW_DOWNLOADS=1)
#   inference                         defaults for `serve`
#   validation                        checks run after setup:
#                                     tools | harnesses | engines | gpu:nvidia | gpu:any

profiles:
  minimal:
    description: Git and network tooling only
    tools:
      required: [git, curl]
      optional: [wget]
    validation: [tools]

  developer:
    description: Python (via uv), Node.js, Git LFS and build tools
    extends: [minimal]
    tools:
      required: [uv, python, node, npm, git-lfs]
      optional: [build-tools, pip]
    validation: [tools]

  coding-agent:
    description: Developer tooling plus terminal coding agents
    extends: [developer]
    harnesses:
      required: [claude-code, codex, qwen-code]
      optional: [opencode, aider]
    validation: [tools, harnesses]

  local-llm:
    description: Developer tooling plus llama.cpp for local GGUF inference (CPU, Metal or CUDA)
    extends: [developer]
    engines: [llama.cpp]
    models:
      preferences: {task: coding, engine: llama.cpp, context: 16384}
      pull: []
    # Used by `make serve PROFILE=local-llm` as defaults (explicit flags win).
    inference: {engine: llama.cpp, host: 127.0.0.1, port: 8000}
    validation: [tools, engines]

  gpu-inference:
    description: NVIDIA GPU server with vLLM and llama.cpp
    extends: [local-llm]
    engines: [vllm]
    models:
      preferences: {task: coding, engine: vllm, context: 32768}
    inference: {engine: vllm, port: 8000, gpu_memory_utilization: 0.90}
    validation: [gpu:nvidia, engines]

  full:
    description: Everything - coding agents and GPU inference
    extends: [coding-agent, gpu-inference]
    validation: [tools, harnesses, engines]
