# Каталог моделей setup-work.
# Исходные записи сверялись с Hugging Face 2026-10-15; новые пользовательские
# заготовки в конце файла требуют заполнения параметров и размеров.
# Геометрия внимания берётся из config.json, размеры весов указаны в десятичных GB.
# quality — условные оценки для ранжирования, а не результаты бенчмарков.
# Поля варианта:
#   format: safetensors | gguf
#   quantization: none | fp8 | awq | mxfp4 | q4_k_m | q5_k_m | q6_k | q8_0 | f16
#   dtype: тип активаций или неквантованных весов
#   files: шаблоны файлов; для GGUF укажите один квант или все его шарды
#   provenance: official — автор модели, community — сторонняя конвертация

