# Рабочий каталог: только выбранные модели Qwen 27B, три варианта весов.
# Источники и ревизии: examples/corp/qwen-27b/README.md.
# Параметры проверены по config.json и метаданным Hugging Face 2026-10-19.
# HDFS-пути задаются в corporate.yaml, source ниже — резервный источник.
# Обе архитектуры гибридные: 64 слоя = 48 Gated DeltaNet + 16 полного внимания.
# num_layers — реальное число слоёв; текущая оценка KV-памяти приближённая.
# size_gb — размер файлов весов в десятичных GB, без архива.

models:
  qwen3.8-27b:
    family: qwen3.8
    display_name: Qwen3.8 27B
    license: apache-2.0
    architecture: dense
    # Полный комплект safetensors включает языковую модель, vision и MTP.
    parameters_b: 27.781427952
    workloads: [general, coding, reasoning, agents]
    tags: [hybrid-attention, vision-language, memory-estimate-approximate]
    context_length: 262144
    attention:
      num_layers: 64
      num_attention_heads: 24
      num_kv_heads: 4
      head_dim: 256
    variants:
      - id: full
        format: safetensors
        dtype: bf16
        repository: Qwen/Qwen3.8-27B
        source: hdfs:///ml/models/hf/qwen3.8-27b.zip
        # 18 файлов safetensors; размеры включают заголовки файлов.
        size_gb: 55.563006776
        engines: [vllm]

      - id: awq
        format: safetensors
        quantization: awq
        # Веса INT4, активации BF16; quant_method в config.json: compressed-tensors.
        # Сохраните исходный config.json в HDFS-архиве: vLLM определяет метод по нему.
        dtype: bf16
        repository: cyankiwi/Qwen3.8-27B-AWQ-INT4
        source: hdfs:///ml/models/hf/qwen3.8-27b-awq.zip
        # 5 файлов safetensors; не все тензоры модели квантованы в INT4.
        size_gb: 21.018000928
        engines: [vllm]
        provenance: community

  qwen3.6-27b:
    family: qwen3.6
    display_name: Qwen3.6 27B GGUF Q4_K_M
    license: apache-2.0
    architecture: dense
    # Число параметров текстовой GGUF-модели по метаданным репозитория Unsloth.
    parameters_b: 26.895998464
    workloads: [general, coding, reasoning, agents]
    tags: [hybrid-attention, memory-estimate-approximate]
    context_length: 262144
    attention:
      num_layers: 64
      num_attention_heads: 24
      num_kv_heads: 4
      head_dim: 256
    variants:
      - id: q4_k_m
        format: gguf
        quantization: q4_k_m
        repository: unsloth/Qwen3.6-27B-GGUF
        source: hdfs:///ml/models/gguf/qwen3.6-27b-gguf-Q4_K_M.zip
        files: [Qwen3.6-27B-Q4_K_M.gguf]
        size_gb: 16.817244384
        engines: [llama.cpp]
        provenance: community
