# Внутренние репозитории агентов. Установка и GigaChat API — в setup.sh каждого.
# Замените repository/ref своими. ref может быть веткой, тегом или коммитом.
# На повторном make setup новая ревизия применяется после подтверждения.
# Порядок ниже используется, если HARNESSES или setup.harnesses не заданы.
# При необходимости: install: {method: setup, script: setup.sh, args: []}
# setup.sh запускается через bash в корне checkout; переменные окружения наследуются.

harnesses:
  qwen-code:
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/qwen-code.git
    ref: CHANGE-ME
    install: {method: setup, script: setup.sh}

  opencode:
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/opencode.git
    ref: CHANGE-ME
    install: {method: setup, script: setup.sh}

  pi:
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/pi-mono.git
    ref: CHANGE-ME
    install: {method: setup, script: setup.sh}

  hermes:
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/hermes-agent.git
    ref: CHANGE-ME
    install: {method: setup, script: setup.sh}

  deepseek:
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/deepseek-agent.git
    ref: CHANGE-ME
    install: {method: setup, script: setup.sh}

  skillhub:
    source: git
    repository: https://CHANGE-ME-bitbucket-host/scm/CHANGE-ME/skillhub.git
    ref: CHANGE-ME
    install: {method: setup, script: setup.sh}
