# Скопируйте в $SETUP_WORK_HOME/config/corporate.yaml (см. README.md рядом).
# Пути HDFS ниже — ПРИМЕРЫ: замените на ваши реальные архивы.
# Каталог этих моделей находится в models.yaml рядом; нужны ОБА файла.

hdfs:
  cli: hdfs
  kerberos: required

env: {}
# При необходимости добавьте несекретные настройки корпоративных сертификатов:
#  SSL_CERT_FILE: /etc/pki/tls/certs/corp-ca-bundle.crt
#  NODE_EXTRA_CA_CERTS: /etc/pki/tls/certs/corp-ca-bundle.crt

models:
  "qwen3.8-27b:full":
    uri: hdfs:///ml/models/hf/qwen3.8-27b/
    format: zip-parts
    # В папке: Qwen_Qwen3.8-27B-1-of-19.zip и остальные части.

  "qwen3.8-27b:awq":
    uri: hdfs:///ml/models/hf/qwen3.8-27b-awq/
    format: zip-parts

  "qwen3.6-27b:q4_k_m":
    uri: hdfs:///ml/models/gguf/Qwen3.6-27B-Q4_K_M.gguf

engines:
  llama.cpp:
    uri: hdfs:///ml/engines/llama.cpp.zip
    # Путь к готовому бинарнику относительно корня ZIP с исходниками и build.
    # Если в корне ZIP сразу src/ и build/, уберите префикс llama.cpp/.
    path: llama.cpp/build/bin/llama-server

  vllm:
    uri: hdfs:///ml/engines/vllm.zip
    # Каталог внутри ZIP, в котором находятся pyvenv.cfg, bin/ и lib/.
    path: vllm-venv

# Node.js и npm скачиваются из SETUP_WORK_NPM_REGISTRY в bootstrap.env.
# Для установки из готового архива можно явно добавить tools.node.uri.

# Источники JAR пока не определены. null — пропустить.
# Позже можно указать прямой HTTPS URL (включая Bitbucket), HDFS или локальный путь:
# trino: {uri: "hdfs:///ml/jars/trino-jdbc-VERSION.jar", format: file, version: "VERSION"}
jars:
  trino: null
  iceberg: null
