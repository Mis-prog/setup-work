# config/corporate.yaml — откуда брать модели, движки и инструменты.
# Шаблон: замените пути на реальные (hdfs:///…, /nfs/…, https://…).
# Секреты сюда не пишутся.

hdfs:
  cli: hdfs                 # или полный путь: /opt/hadoop/bin/hdfs
  kerberos: required        # без билета (klist -s) — стоп и подсказка `kinit`

# Несекретные переменные для всех команд setup-work (ваше окружение важнее).
env: {}
#  SSL_CERT_FILE: /etc/pki/tls/certs/corp-ca-bundle.crt
#  NODE_EXTRA_CA_CERTS: /etc/pki/tls/certs/corp-ca-bundle.crt

# Хост Bitbucket: сборка харнессов оттуда не требует ALLOW_BUILD=1.
trusted_git_hosts:
  - CHANGE-ME-bitbucket-host   # без https:// и пути

# Для vLLM укажите папку с файлами <имя>-1-of-N.zip; для llama.cpp — сам GGUF.
models:
  "qwen3.8-27b:full":
    uri: hdfs:///ml/models/hf/qwen3.8-27b/
    format: zip-parts
  "qwen3.8-27b:awq":
    uri: hdfs:///ml/models/hf/qwen3.8-27b-awq/
    format: zip-parts
  "qwen3.6-27b:q4_k_m":
    uri: hdfs:///ml/models/gguf/Qwen3.6-27B-Q4_K_M.gguf

# Движки: готовая сборка llama.cpp (llama-server + .so) и venv vLLM, упакованный
# `zip -r` (собирайте на той версии Python, что стоит на машинах).
engines:
  llama.cpp:
    uri: hdfs:///ml/engines/llama.cpp-b11080-cuda12.8-linux-x64.zip
  vllm:
    uri: hdfs:///ml/engines/vllm-0.30.0-py312-cu128-venv.zip

# Node.js и npm скачиваются из SETUP_WORK_NPM_REGISTRY в bootstrap.env.
# Для установки из готового архива можно явно добавить tools.node.uri.

# Источники JAR пока не определены. null — пропустить.
# Позже можно указать прямой HTTPS URL (включая Bitbucket), HDFS или локальный путь:
# trino: {uri: "hdfs:///ml/jars/trino-jdbc-VERSION.jar", format: file, version: "VERSION"}
jars:
  trino: null
  iceberg: null

# Учёт токенов отдела. После настройки API-прокси или hook включите сбор.
metrics:
  enabled: false
  hdfs_uri: null  # например hdfs:///ml/metrics/agent-usage
  department: null
  user_id: null   # по умолчанию пользователь ОС
  device_id: null # по умолчанию ID установки + hostname; не задавайте один ID всему отделу
  upload_interval_s: 300
  batch_size: 1000
  upload_timeout_s: 60
