# Example: adding your own harnesses.
#
# Copy the entries you need into ~/.config/setup-work/harnesses.yaml (or
# $SETUP_WORK_USER_CONFIG_DIR/harnesses.yaml). They are merged with the built-in
# recipes; an entry with the same name overrides the built-in one.
#
#   make config-validate               # schema + cross-reference check
#   make harness-install NAME=custom-agent DRY_RUN=1
#   make harness-install NAME=custom-agent
#   make harness-doctor NAME=custom-agent
#
# Never put secret values here. `environment.required` lists variable *names*
# that harness-doctor checks for; set the values in your shell or a secrets manager.

harnesses:
  # A private Git repository with a Python package. Uses your existing Git
  # credentials (SSH agent / credential helper); prompts are disabled.
  custom-agent:
    description: Internal coding agent (Python)
    source: git
    repository: git@github.example.com:platform/custom-agent.git
    ref: v1.4.2                  # tag or commit SHA = pinned; a branch works but is reported unpinned
    install:
      method: uv                 # creates <data>/harnesses/custom-agent/.venv and pip-installs the checkout
      python: "3.12"
    binaries: [custom-agent]
    environment:
      required: [OPENAI_BASE_URL, OPENAI_API_KEY]
    verify: [custom-agent, --version]

  # A Node.js tool from a Git repo that needs a build step. The build command
  # is only executed with ALLOW_BUILD=1 after you have reviewed it.
  internal-node-agent:
    description: Internal agent (TypeScript)
    source: git
    repository: https://git.example.com/tools/node-agent.git
    ref: 3f2c1e9a7b
    install:
      method: npm
      build: [npm, run, build]
    binaries: [node-agent]
    requires: {node: ">=22"}

  # A checkout that already exists on disk, exposing a script as-is.
  scratch-agent:
    source: local
    path: ~/src/scratch-agent
    install: {method: none}
    binaries: [scratch-agent]

  # Point a registry package at a different pinned version than the built-in recipe.
  qwen-code:
    description: Qwen Code pinned for our team
    source: npm
    package: "@qwen-code/qwen-code"
    version: 0.24.7
    binaries: [qwen]
    requires: {node: ">=22"}
    environment:
      optional: [OPENAI_API_KEY, OPENAI_BASE_URL, OPENAI_MODEL]
    verify: [qwen, --version]
